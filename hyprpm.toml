[repository]
name = "hyprfield"
authors = ["zurat"]
commit_pins = [["0.56.2", ""]]

# Every plugin in this collection targets this exact Hyprland version.

[hello]
description = "A minimal Hyprland plugin example"
authors = ["zurat"]
output = "build/hello/hello.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --parallel",
]

[hyprdimension]
description = "Monitor-scoped dimensional workspaces"
authors = ["zurat"]
output = "build/hyprdimension/hyprdimension.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --parallel",
]
