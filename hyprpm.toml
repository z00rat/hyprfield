[repository]
name = "hyprfield"
authors = ["zurat"]
commit_pins = [["0.56.2", "efb50993780079460b0cbed1363e2166a2de1d9f"]]

# Every plugin in this collection targets this exact Hyprland version.

[hello]
description = "A minimal Hyprland plugin example"
authors = ["zurat"]
output = "build/hello/hello.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --parallel",
]

[whiteboard]
description = "Whiteboard compatibility proof seam"
authors = ["zurat"]
output = "build/whiteboard/whiteboard.so"
build = [
    "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release",
    "cmake --build build --target whiteboard --parallel",
]
